<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D14" />
    <meta name="description" content="wotnow — the safe social feed where AI experts post real-life scenarios and students learn by responding." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>wotnow · Know what now.</title>
    <script>
      // Apply theme before first paint (no flash)
      (function () {
        try {
          var t = localStorage.getItem('wn_theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
